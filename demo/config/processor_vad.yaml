type: demo.vad_wrapper.FixedDialogueVADProcessor
base_speech_processor_class: stream_eval.processor.fixed_processor_dialogue.SimPOTransChunkProcessor

speech_chunk_size: 2.0
audio_step_size: 0.25
# Hard limit for accumulated speech audio before resetting speech context and LLM KV cache.
max_speech_context_seconds: 30.0
# Reset speech context and LLM KV cache after this limit when a non-empty translation ends with terminal punctuation.
soft_speech_context_reset_seconds: 15.0
device: cuda
simulst_visible_devices: "0"
source_language: en
target_language: zh
model_config: src/st_backbone/config.yaml
model_config_overrides:
  prompt_path: src/st_backbone/st_prompt.json
  application_background: ""
checkpoint: checkpoints/multilingual/rl_stream/best
vad_threshold: 0.55
vad_speech_pad_ms: 30
vad_window_size_samples: 512
vad_min_silence_duration_ms: 300
# Defer short VAD tail chunks and merge them into the next speech segment.
vad_min_flush_chunk_seconds: 1.0
# Clear all processor state after this many seconds of VAD silence; set <=0 to disable.
vad_clear_silence_seconds: 10.0

tts:
  common:
    enabled: false
    backend: cosyvoice3 # cosyvoice3 or magictts
    stream: false
    flush_min_units: 0
    audio_frame_ms: 200
    default_speaker: default
    speakers:
      - id: default
        label: Default
        prompt_wav: ""
        prompt_text: ""
  cosyvoice3:
    prompt_duration_seconds: 3.0
    runtime: subprocess
    python: .cosyvoice-venv/bin/python
    model_dir: checkpoints/cosyvoice3
    instruction_prefix: "You are a helpful assistant."
    japanese_preprocess: mecab_unidic
  magictts:
    runtime: inprocess
    python: .venv/bin/python
    magictts_dir: third_party/MAGIC-TTS
    magictts_checkpoint: third_party/MAGIC-TTS/checkpoints/magictts_36k.pt
    magictts_mode: spontaneous
    magictts_steps: 32
    magictts_cfg_strength: 2.0
    magictts_sway_sampling_coef: -1.0

decode:
  max_new_tokens: 32
  do_sample: True
  beam_num: 1
  # demo/run_demo.sh can override decode at startup with decode_mode=sample or decode_mode=beam.
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.2
  no_repeat_ngram_size: 4
